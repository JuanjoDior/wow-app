name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run i18n guards
        run: flutter test test/core/l10n/arb_glossary_guard_test.dart test/core/l10n/hardcoded_ui_strings_guard_test.dart

      - name: Build Web
        run: flutter build web --release --base-href "/wow-app/" --dart-define=BUILD_VERIFICATION_V2=true --dart-define=CATALOG_SEARCH_V2=true --dart-define=FEATURE_BUILD_INTELLIGENCE=true --dart-define=FEATURE_WEEKLY_PLANNER=false --dart-define=FEATURE_ECONOMY_ASSISTANT=false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
