name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run i18n guards
        run: flutter test test/core/l10n/arb_glossary_guard_test.dart test/core/l10n/hardcoded_ui_strings_guard_test.dart

      - name: Show release flags
        run: |
          echo "FEATURE_BUILD_INTELLIGENCE=true"

      - name: Build Web
        run: |
          flutter build web --release \
            --base-href "/wow-app/" \
            --dart-define=CATALOG_SEARCH_V2=true \
            --dart-define=FEATURE_BUILD_INTELLIGENCE=true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Smoke check GitHub Pages (web app)
        run: |
          set -euo pipefail
          URL="https://juanjodior.github.io/wow-app/"
          ok=0
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/wow-app-page.html -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] && grep -q "flutter_bootstrap.js" /tmp/wow-app-page.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "La web no respondió con el index esperado en GitHub Pages."
            exit 1
          fi

      - name: Smoke check Worker health/capabilities
        run: |
          set -euo pipefail
          HEALTH_URL="https://wow-recommendations.wow-comp-app.workers.dev/health"
          health=$(curl -sS "$HEALTH_URL")
          compact=$(echo "$health" | tr -d '[:space:]')

          echo "health=$health"

          echo "$compact" | grep -q '"status":"ok"'
          echo "$compact" | grep -q '"build_verification_v2":true'
          echo "$compact" | grep -q '"catalog_search_v2":true'
